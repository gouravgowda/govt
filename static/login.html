<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Log in / Sign up — SchemeSetu</title>
<style>
:root{
  --navy:#0f2f5c; --navy-d:#0a2344; --ink:#111827; --body:#1f2937; --mut:#5b6472;
  --line:#d5dae1; --bg:#f4f5f7; --saffron:#e8862d; --red:#b91c1c;
}
*{box-sizing:border-box}
:root{color-scheme:light}
body{font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--body);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--navy);text-decoration:underline;text-underline-offset:2px}

.tri{height:4px;background:linear-gradient(90deg,#ff9933 0 33.4%,#ececec 33.4% 66.7%,#138808 66.7% 100%)}
header.nav{background:var(--navy);color:#fff}
header.nav .wrap{max-width:1080px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand .mk{width:32px;height:32px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:16px}
.brand b{font-size:16.5px}

main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:56px 16px}
.card{background:#fff;border:1px solid var(--ink);width:100%;max-width:440px}
.cardhead{padding:22px 26px 0}
h1{font-size:23px;font-weight:800;color:var(--ink);margin:0 0 6px;letter-spacing:-.2px}
.sub{font-size:14px;color:var(--mut);margin:0 0 20px}

.tabs{display:flex;border-bottom:2px solid var(--line);padding:0 26px}
.tabs button{flex:0 0 auto;background:none;border:0;padding:12px 2px;margin-right:28px;font-size:15px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--navy)}

form{padding:22px 26px 26px}
label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin:16px 0 6px}
label:first-child{margin-top:0}
input{width:100%;padding:12px 13px;border:2px solid #6b7280;border-radius:0;font-size:15.5px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid #ffdd00;border-color:var(--navy)}
.hintline{font-size:12.5px;color:var(--mut);margin-top:5px}
.pwwrap{position:relative}
.pwwrap input{padding-right:46px}
.eye{position:absolute;right:0;top:0;height:100%;width:44px;background:none;border:0;border-left:2px solid #e3e6ea;cursor:pointer;color:var(--mut);display:grid;place-items:center}
.eye:hover{color:var(--ink)}
button.go{width:100%;margin-top:24px;background:var(--navy);color:#fff;border:0;padding:14px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--navy-d)}
button.go:hover{background:#163d76}
button.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy-d)}
button.go:disabled{opacity:.6;cursor:wait;transform:none}
.err{display:none;border-left:5px solid var(--red);background:#fdf0f0;color:#7f1d1d;padding:11px 13px;font-size:14px;margin-top:16px}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:18px 0 12px}
.ordiv::before,.ordiv::after{content:'';flex:1;border-top:1px solid var(--line)}
button.gbtn{width:100%;background:#fff;border:2px solid var(--ink);padding:12px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink)}
button.gbtn:hover{background:#f4f5f7}
.backlink{display:block;text-align:center;margin:0;padding:16px;border-top:1px solid var(--line);font-size:14px}
.foot{max-width:440px;margin:14px auto 0;font-size:12.5px;color:var(--mut);text-align:center;padding:0 4px 30px}
</style>
</head>
<body>

<div class="tri"></div>
<header class="nav">
  <div class="wrap"><a class="brand" href="/"><span class="mk">S</span><b>SchemeSetu</b></a></div>
</header>

<main>
  <div>
    <div class="card">
      <div class="cardhead">
        <h1 id="title">Log in</h1>
        <p class="sub" id="sub">Free account · guidance only · no sensitive documents needed.</p>
      </div>
      <div class="tabs">
        <button id="tLogin" class="on" onclick="mode('login')">Log in</button>
        <button id="tSignup" onclick="mode('signup')">Sign up</button>
      </div>
      <form onsubmit="go();return false">
        <div id="nameWrap" style="display:none">
          <label for="name">Your name</label>
          <input id="name" placeholder="e.g. Priya Sharma" autocomplete="name"/>
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email"/>
        <label for="pw">Password</label>
        <div class="pwwrap">
          <input id="pw" type="password" placeholder="At least 6 characters" autocomplete="current-password"/>
          <button type="button" class="eye" onclick="togglePw()" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="hintline" id="pwHint" style="display:none">Use at least 6 characters.</div>
        <button class="go" id="goBtn" type="submit">Continue</button>
        <div class="err" id="err" role="alert"></div>
      </form>
      <div id="googleWrap" style="display:none;padding:0 26px 4px">
        <div class="ordiv"><span>or</span></div>
        <button class="gbtn" id="googleBtn" onclick="googleLogin()">
          <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2.1 4.3-5.1 4.3-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-.1.1-3.7 2.9v.1C3.4 21.4 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.2-1.7.4-2.4l-.1-.1-3.6-2.8-.1.1C.5 8.6 0 10.2 0 12s.5 3.4 1.4 4.9l3.8-2.5z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.4 0 3.4 2.6 1.4 6.9l3.8 2.9c1-2.9 3.7-5.1 6.8-5.1z"/></svg>
          Continue with Google
        </button>
      </div>
      <a class="backlink" href="/">← Back to home</a>
    </div>
    <p class="foot">We never ask for Aadhaar, PAN or bank details. Final eligibility is decided by the scheme authority.</p>
  </div>
</main>

<!-- Firebase SDK (CDN) — the single accepted external script; enables Google
     login and Firebase email auth when the backend reports firebase:true.
     Without it (or when the backend has no key), the page falls back to the
     built-in local account system, fully offline. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
// API host: same origin on localhost, Render backend everywhere else.
const API_BASE=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'':'https://govt-9bjq.onrender.com';
// Embedded fallback config (also served live by GET /auth/config).
const FALLBACK_CONFIG={"apiKey":"AIzaSyCUhNiQkOd6KxhhNakieZRDhHOKLOjOEEU","authDomain":"govt-11bb5.firebaseapp.com","projectId":"govt-11bb5","storageBucket":"govt-11bb5.firebasestorage.app","messagingSenderId":"567957734207","appId":"1:567957734207:web:134c93b13fc5b7ac75898a"};
let M='login', FB=null;
if(localStorage.getItem('ss_token')) location.href='/chat';
async function boot(){
  try{
    const r=await fetch(API_BASE+'/auth/config');const j=await r.json();
    if(j.firebase && window.firebase){
      firebase.initializeApp(j.config||FALLBACK_CONFIG);
      FB=firebase.auth();
      document.getElementById('googleWrap').style.display='block';
    }
  }catch(e){/* local-account mode */}
}
function friendly(e){
  const c=(e&&e.code)||'';
  if(c==='auth/user-not-found'||c==='auth/wrong-password'||c==='auth/invalid-credential')return 'Wrong email or password.';
  if(c==='auth/email-already-in-use')return 'An account with this email exists — try logging in.';
  if(c==='auth/weak-password')return 'Password must be at least 6 characters.';
  if(c==='auth/invalid-email')return 'Enter a valid email address.';
  if(c==='auth/popup-closed-by-user')return 'Google sign-in was closed — try again.';
  return (e&&e.message)||'Something went wrong.';
}
async function finishWithUser(user){
  const token=await user.getIdToken();
  localStorage.setItem('ss_token',token);
  localStorage.setItem('ss_name',user.displayName||(user.email||'').split('@')[0]||'there');
  location.href='/chat';
}
async function googleLogin(){
  hideErr();
  try{
    const cred=await FB.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    await finishWithUser(cred.user);
  }catch(e){showErr(friendly(e));}
}
function mode(m){
  M=m;
  document.getElementById('tLogin').className=m==='login'?'on':'';
  document.getElementById('tSignup').className=m==='signup'?'on':'';
  document.getElementById('nameWrap').style.display=m==='signup'?'block':'none';
  document.getElementById('title').textContent=m==='signup'?'Create your free account':'Log in';
  document.getElementById('sub').textContent=m==='signup'
    ?'One minute to sign up — then 8 questions to your ranked schemes.'
    :'Free account · guidance only · no sensitive documents needed.';
  document.getElementById('pw').autocomplete=m==='signup'?'new-password':'current-password';
  document.getElementById('pwHint').style.display=m==='signup'?'block':'none';
  hideErr();
}
function togglePw(){
  const p=document.getElementById('pw');
  p.type=p.type==='password'?'text':'password';
}
function showErr(t){const e=document.getElementById('err');e.textContent=t;e.style.display='block';}
function hideErr(){document.getElementById('err').style.display='none';}
async function go(){
  hideErr();
  const btn=document.getElementById('goBtn');
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('pw').value;
  btn.disabled=true;const old=btn.textContent;btn.textContent='Please wait…';
  try{
    if(FB){
      // Firebase mode: email/password via Firebase Auth
      let user;
      if(M==='signup'){
        const name=document.getElementById('name').value.trim();
        if(!name){showErr('Please enter your name.');return;}
        const cred=await FB.createUserWithEmailAndPassword(email,pw);
        await cred.user.updateProfile({displayName:name});
        user=cred.user;
      }else{
        const cred=await FB.signInWithEmailAndPassword(email,pw);
        user=cred.user;
      }
      await finishWithUser(user);
      return;
    }
    // Local-account mode (backend has no Firebase key): original flow
    const body=M==='signup'?{name:document.getElementById('name').value.trim(),email,password:pw}:{email,password:pw};
    const r=await fetch(API_BASE+'/auth/'+M,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){showErr(j.detail||'Something went wrong.');return;}
    localStorage.setItem('ss_token',j.token);localStorage.setItem('ss_name',j.name);
    location.href='/chat';
  }catch(e){showErr(FB?friendly(e):'Network error. Is the server running?');}
  finally{btn.disabled=false;btn.textContent=old;}
}
mode('login');
boot();
</script>
</body>
</html>
